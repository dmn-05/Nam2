<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Chào mừng bạn đến với Node.js!</h1>
    <img id="img" src="/img/h.png" alt="Hình ảnh mẫu"> <!-- Sửa đường dẫn hình ảnh -->
    <script>
        $(document).ready(function () {
            $("#img").click(function () {
                $.ajax({
                    url: "/img/h.png",
                    type: "HEAD",
                    success: function () {
                        alert("Ảnh tồn tại!");
                    },
                    error: function () {
                        alert("Ảnh không tìm thấy!");
                    }
                });
            });
        });
    </script>
</body>
</html>
